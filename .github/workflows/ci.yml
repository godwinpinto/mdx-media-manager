name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4 # version from "packageManager" in package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint:format
      - run: pnpm lint
      - run: pnpm types:check
      - run: pnpm test --run

  package:
    # The published package, installed with npm into an empty project, on the oldest Node
    # versions it supports ("engines": ^20.19.0 || >=22.12.0)
    name: Package on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20.19', '22.12', '24']
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=mdx-media-manager...
      - name: Pack
        run: |
          cd packages/mdx-media-manager
          pnpm pack --pack-destination "$RUNNER_TEMP"
          echo "TARBALL=$(ls "$RUNNER_TEMP"/mdx-media-manager-*.tgz)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - name: Install into an empty project and load every entry point
        run: |
          mkdir "$RUNNER_TEMP/consumer" && cd "$RUNNER_TEMP/consumer"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "$TARBALL" react react-dom
          test ! -e node_modules/@aws-sdk/client-s3 # optional: only S3 users install it
          node --input-type=module -e "
            for (const entry of ['next', 'vite', 'loader', 'server']) await import('mdx-media-manager/' + entry);
            console.log('entry points load on Node', process.version);
          "
          npx mdx-media-manager --help
